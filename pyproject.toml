[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senna-music"
version = "0.1.0"
description = "Local-first music library, downloader and player"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "platformdirs>=4.2",
  "mutagen>=1.47",
  "yt-dlp>=2025.1.15",
  "spotdl>=4.2.11",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
senna-music = "senna_music.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
